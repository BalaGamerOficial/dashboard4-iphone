<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dashboard4">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
  <title>Dashboard4</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="./icon.svg" alt="" width="38" height="38"><div><strong>Dashboard4</strong><span id="course">Tu curso, contigo.</span></div></div>
    <button id="sync" class="icon-button" aria-label="Sincronizar ahora" title="Sincronizar ahora">↻</button>
  </header>
  <div id="sync-status" class="sync-status" role="status" aria-live="polite">Cargando copia local…</div>
  <main id="app" tabindex="-1"></main>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="home" aria-current="page"><span>⌂</span>Hoy</button>
    <button data-tab="calendar"><span>▦</span>Agenda</button>
    <button data-tab="tasks"><span>☑</span>Tareas</button>
    <button data-tab="subjects"><span>▤</span>Notas</button>
    <button data-tab="library"><span>▧</span>Biblioteca</button>
    <button data-tab="settings"><span>⚙</span>Más</button>
  </nav>
  <dialog id="reader"><div class="reader-toolbar"><button id="close-reader" class="button secondary">Cerrar</button><button id="save-document" class="button secondary">Guardar texto</button></div><h2 id="reader-title"></h2><pre id="reader-content"></pre></dialog>
  <input type="file" id="import-backup" accept="application/json,.json" hidden>
  <noscript>Activa JavaScript en Safari para usar Dashboard4.</noscript>
</body>
</html>
